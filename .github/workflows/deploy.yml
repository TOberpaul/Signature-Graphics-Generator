name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the page be rebuilt from the Actions tab without a new commit.
  workflow_dispatch:

# Least privilege: read the repository, and only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued rather than cancelled, so a run that is
# already publishing is never interrupted half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a commit SHA rather than a tag. A tag like `v7`
      # is mutable, so it can point at different code tomorrow than it does now.
      # The trailing comment keeps the release readable, since the SHA alone says
      # nothing about how far behind the pin has fallen. Dependabot moves these
      # forward - see .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runtime version lives in .nvmrc, so CI and local development read it
      # from the same place instead of a number here that drifts out of step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The postinstall script of @db-ux/db-theme decrypts the licensed DB brand
      # assets with these values. Without them the install still succeeds and the
      # components fall back to the white label theme, so a missing secret shows
      # up as a wrong looking page rather than a failed build.
      - name: Install dependencies
        run: npm ci
        env:
          ASSET_INIT_VECTOR: ${{ secrets.ASSET_INIT_VECTOR }}
          ASSET_PASSWORD: ${{ secrets.ASSET_PASSWORD }}

      - name: Type check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build static site
        run: npm run build
        env:
          # Switches on the base path for the project sub directory.
          GITHUB_PAGES: "true"

      # `enablement` switches Pages on through the API if it is still off, so the
      # first deployment does not depend on someone having clicked through the
      # repository settings first. Without it this step is where the run fails.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      # `include-hidden-files` is off by default since v4 of this action, which
      # would silently drop out/.nojekyll from the artifact. Pages serves the
      # artifact without running Jekyll, so the file is probably redundant, but
      # losing it as a side effect of an action upgrade is not the way to find
      # that out.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
